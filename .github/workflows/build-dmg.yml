name: Build macOS DMG

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package DMG
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          swift Tests/TrackpadToggleTests.swift

      - name: Build Application and DMG
        run: |
          chmod +x build.sh scripts/create_dmg.sh
          bash build.sh --dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackpadToggle-DMG
          path: build/TrackpadToggle.dmg
          if-no-files-found: error

      - name: Release Asset (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TrackpadToggle.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Homebrew Tap (rajanraj2/homebrew-tap)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "⚠️ HOMEBREW_TAP_TOKEN secret is not set. Skipping Homebrew tap update."
            exit 0
          fi

          NEW_VERSION="${GITHUB_REF#refs/tags/v}"
          NEW_SHA=$(shasum -a 256 build/TrackpadToggle.dmg | awk '{print $1}')
          echo "Updating Homebrew Tap for Trackpad Toggle v${NEW_VERSION} (SHA-256: ${NEW_SHA})…"

          # Clone the tap repository using authenticated token
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/rajanraj2/homebrew-tap.git" tap-repo

          # Update version and sha256 in Casks/trackpad-toggle.rb
          perl -pi -e "s/version \".*\"/version \"${NEW_VERSION}\"/g" tap-repo/Casks/trackpad-toggle.rb
          perl -pi -e "s/sha256 \".*\"/sha256 \"${NEW_SHA}\"/g" tap-repo/Casks/trackpad-toggle.rb

          # Verify updated content
          echo "Updated Cask file:"
          cat tap-repo/Casks/trackpad-toggle.rb

          # Commit and push to rajanraj2/homebrew-tap
          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/trackpad-toggle.rb
          git commit -m "Bump trackpad-toggle to v${NEW_VERSION}" || echo "No changes to commit"
          git push origin main
          echo "✅ Successfully updated rajanraj2/homebrew-tap to v${NEW_VERSION}!"
