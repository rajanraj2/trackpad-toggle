name: Build macOS DMG

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package DMG
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: |
          swift Tests/TrackpadToggleTests.swift

      - name: Build Application and DMG
        run: |
          chmod +x build.sh scripts/create_dmg.sh
          bash build.sh --dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrackpadToggle-DMG
          path: build/TrackpadToggle.dmg
          if-no-files-found: error

      - name: Release Asset (Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/TrackpadToggle.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
